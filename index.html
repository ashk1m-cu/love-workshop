<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What is love? Teach a robot to belong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --ink:#0f141c; --ink2:#3a4558; --muted:#4f5a70;
  --line:rgba(15,20,28,.14); --wash:rgba(15,20,28,.05); --wash2:rgba(15,20,28,.09);
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:var(--sans);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
.d-who{--c:#e8307f;--cl:#f183b2;--cs:#b02461;--cf:#871c4a;--cd:#250814;--ca:#d12b72;--ci:#fff}
.d-what{--c:#f2602b;--cl:#f7a080;--cs:#b84921;--cf:#8c3819;--cd:#270f07;--ca:#b64820;--ci:#fff}
.d-when{--c:#f2b01e;--cl:#f7d078;--cs:#b88617;--cf:#8c6611;--cd:#271c05;--ca:#6d4f0e;--ci:#1a1405}
.d-where{--c:#139785;--cl:#71c1b6;--cs:#0e7365;--cf:#0b584d;--cd:#031815;--ca:#108071;--ci:#fff}
.d-how{--c:#7b4ae2;--cl:#b092ee;--cs:#5d38ac;--cf:#472b83;--cd:#140c24;--ca:#6f43cb;--ci:#fff}
.d-feeling{--c:#2d56d6;--cl:#819ae6;--cs:#2241a3;--cf:#1a327c;--cd:#070e22;--ca:#284dc1;--ci:#fff}

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;transition:background-color .4s;
  background:linear-gradient(var(--wash) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--wash) 1px,transparent 1px) 0 0/32px 32px,var(--pg,var(--bg))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--c,var(--ink));outline-offset:3px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem}
.err{color:#c4281c;font-size:.92rem;min-height:1.2em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;font-weight:600;transition:background .2s,transform .15s,border-color .2s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--pbg,var(--ink));color:var(--pink,#fff);border-color:transparent}
.btn.primary:hover:not(:disabled){background:var(--pbg,var(--ink));filter:brightness(1.25)}
.station .btn.primary{--pbg:var(--c);--pink:var(--ci)}
.btn.ghost{background:transparent}
.btn.big{padding:15px 28px;font-size:1.02rem;border-radius:12px}
.btn.sm{padding:6px 13px;font-size:.88rem;border-radius:8px}
.input,textarea.input{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit}
textarea.input{min-height:120px;resize:vertical;line-height:1.5}
.input:focus{outline:2px solid var(--c,var(--ink));border-color:transparent}
.input::placeholder{color:#8a94a6}
.input.big{font-family:var(--display);font-size:1.3rem;font-weight:500;padding:16px 18px;letter-spacing:-.03em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}

/* front page */
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.hero{max-width:680px;text-align:center;display:grid;gap:22px;justify-items:center}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.02;letter-spacing:-.05em}
.hero p{color:var(--ink2);font-size:1.08rem;max-width:32em}
.pots{display:flex;gap:clamp(8px,2.6vw,22px);justify-content:center;flex-wrap:wrap}
.pot{display:grid;justify-items:center;gap:8px}
.pot .vial{width:48px;height:64px;filter:drop-shadow(0 8px 10px rgba(15,20,28,.2))}
.pot .vial-wrap{animation:float 6s ease-in-out infinite}
.pot:nth-child(2n) .vial-wrap{animation-delay:-2s}.pot:nth-child(3n) .vial-wrap{animation-delay:-4s}
.pot b{font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:-.04em;color:var(--ca)}
@media(max-width:480px){.pots{gap:4px;flex-wrap:nowrap}.pot .vial{width:34px;height:46px}.pot b{font-size:.7rem}.hero{gap:16px}}
.choices{display:grid;gap:12px;width:min(460px,100%)}
.choice{text-align:left;padding:18px 20px;border-radius:14px;border:1px solid var(--line);background:#fff}
.choice:hover{border-color:var(--ink)}
.choice b{display:block;font-family:var(--display);font-size:1.05rem;font-weight:600;letter-spacing:-.03em;margin-bottom:2px}
.choice span{color:var(--muted);font-size:.95rem}
.pulse-heart{width:46px;height:46px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.12)}36%{transform:scale(1)}54%{transform:scale(1.07)}}

/* stage */
.stage{max-width:1480px;margin:0 auto;padding:16px clamp(16px,3vw,36px) 36px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topl{display:flex;align-items:center;gap:14px}
.top{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:.98rem;letter-spacing:-.04em}
.brand svg{width:22px;height:22px}
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper li{font-size:.82rem;font-weight:500;color:var(--muted);padding:6px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;transition:all .4s}
.stepper li.done{color:var(--ink)}
.stepper li.now{color:#fff;background:var(--ink);border-color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:minmax(300px,.8fr) 1.35fr;gap:clamp(20px,3vw,44px);align-items:start;flex:1}
.robotcol{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 21% 18px;background:#fff;border:1px solid var(--line);border-radius:18px}
.robotwrap{position:relative;width:100%;max-width:300px;aspect-ratio:26/38;transition:max-width .8s}
.robotwrap>svg{display:block;width:100%;height:100%}
.stage[data-phase=talk] .robotwrap,.stage[data-phase=vote] .robotwrap,.stage[data-phase=end] .robotwrap{max-width:260px}
.nameplate{font-family:var(--display);font-size:1.25rem;font-weight:500;letter-spacing:-.04em;min-height:1.4em;text-align:center}
.nameplate small{display:block;font:400 .88rem var(--sans);letter-spacing:0;color:var(--muted)}
.panelcol{min-width:0}
@media(max-width:920px){.grid{grid-template-columns:1fr}.robotcol{position:relative;top:0}.robotwrap{max-width:240px}.frag{width:16%!important}}

/* robot vessel */
.rbt{width:100%;height:100%;overflow:visible;display:block}
.rbt .tk{stroke:rgba(15,20,28,.4);stroke-width:1.5}
.rbt .part *{fill:rgba(15,20,28,.03);stroke:rgba(15,20,28,.35);stroke-width:2.2;stroke-dasharray:7 7;transition:fill .9s,stroke .9s,fill-opacity .9s}
.rbt .part .ln{fill:none!important}
.rbt .part.on *{fill:var(--pc);fill-opacity:.3;stroke:var(--pc);stroke-dasharray:0}
.rbt .frame *{fill:rgba(15,20,28,.02);stroke:rgba(15,20,28,.3);stroke-width:2.2;transition:stroke .9s}
.rbt.full .frame *{stroke:#0f141c}
.rbt .ant *{fill:none;stroke:rgba(15,20,28,.3);stroke-width:2.2;transition:all .9s}
.rbt.alive .ant *{stroke:#0f141c}
.rbt.alive .ant circle{fill:#ffc933}
.rbt .pupil{fill:#0f141c;opacity:0;transition:opacity 1s}
.rbt.alive .pupil{opacity:1}
.rbt.alive #p-what{animation:blink 5.5s infinite;transform-origin:200px 128px}
.rbt.alive #p-feeling{animation:beat 1.5s infinite;transform-origin:240px 252px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
.lay{transition:transform 1.6s cubic-bezier(.2,.8,.2,1),opacity 1.2s;transform:translateY(var(--ty,90px));opacity:0}
.wv{animation:wv 6s linear infinite}
.lay:nth-child(2n) .wv{animation-duration:8s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-100px)}}
.bub{fill:rgba(255,255,255,.7);animation:rise 7s linear infinite;opacity:0}
.rbt.full .bub,.rbt .bub.on{opacity:1}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-300px);opacity:0}}
.rbt.splash{filter:drop-shadow(0 0 18px var(--flash,#000));transition:filter .3s}
.rbt.res-yes{filter:drop-shadow(0 0 22px #ffc933)}
.rbt.res-no{filter:grayscale(1) opacity(.6)}
.rbt.res-notyet{animation:dimpulse 3.4s ease-in-out infinite}
@keyframes dimpulse{50%{filter:saturate(.5) opacity(.75)}}

/* fragments around robot */
.frags{position:absolute;inset:0;pointer-events:none}
.frag{position:absolute;width:17%;aspect-ratio:1;border-radius:6px;border:3px solid var(--c);background:#fff;overflow:hidden;
  box-shadow:0 10px 22px -10px rgba(15,20,28,.5);animation:float 8s ease-in-out infinite;animation-delay:var(--dl,0s);pointer-events:auto;display:grid;place-items:center}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.f-img{background-size:240%;background-repeat:no-repeat}
.f-vid video{width:100%;height:100%;object-fit:cover}
.f-txt{padding:7px;font:500 .74rem/1.2 var(--sans);color:var(--ink);text-align:left;align-content:center}
.f-aud{cursor:pointer}
.bars{display:flex;gap:3px;align-items:center;height:36px}
.bars i{display:block;width:4px;border-radius:3px;background:var(--c,#2d56d6);height:30%}
.bars i:nth-child(2n){height:60%}.bars i:nth-child(3n){height:90%}.bars i:nth-child(5n){height:45%}
.playing .bars i,.bars.live i{animation:eq .7s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.1s}.bars i:nth-child(3){animation-delay:.25s}.bars i:nth-child(4){animation-delay:.05s}.bars i:nth-child(5){animation-delay:.35s}.bars i:nth-child(6){animation-delay:.15s}
@keyframes eq{to{height:100%}}

/* panels */
.panel{display:grid;gap:22px;align-content:start;padding-top:4px}
.title{font-family:var(--display);font-weight:500;font-size:clamp(2rem,3.8vw,3.2rem);line-height:1.04;letter-spacing:-.05em}
.h2{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,2.3vw,1.9rem);line-height:1.15;letter-spacing:-.04em}
.lede{font-size:1.14rem;color:var(--ink2);max-width:38em;line-height:1.55}
.quote{font-size:1.12rem;line-height:1.4;color:var(--ink2);border-left:3px solid var(--ink);padding-left:16px;max-width:34em}
.how{display:grid;gap:10px;max-width:40em}
.how div{display:flex;gap:14px;align-items:baseline;color:var(--ink2)}
.how b{font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:-.03em;color:var(--ink);min-width:4.6em}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{display:flex;align-items:center;gap:8px;padding:5px 13px 5px 8px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:.9rem;font-weight:500}
.slot .vial{width:18px;height:24px}
.slot.taken{background:var(--c);color:var(--ci);border-color:transparent}
.slot.taken .vial-wrap{display:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px}
.progress{height:6px;border-radius:6px;background:var(--wash2);overflow:hidden;max-width:420px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#e8307f,#f2602b,#f2b01e,#139785,#7b4ae2,#2d56d6);transition:width 1s}

/* rooms (neon cutaways) */
.building{background:#080a10;padding:12px;border-radius:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.room{position:relative;display:flex;flex-direction:column;background:var(--cd);color:#fff;border-radius:6px;overflow:hidden;text-align:left;padding:0;border:1.5px solid var(--c);box-shadow:0 0 22px -8px var(--c);font:inherit;transition:filter .4s,transform .2s,box-shadow .6s}
.room:not(.claimed):not(.ready):not(.poured){filter:saturate(.55) brightness(.75)}
.room.ready,.room.poured{box-shadow:0 0 0 1px var(--cl),0 0 34px -2px var(--c)}
button.room{cursor:pointer}
button.room:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--cl),0 0 42px 0 var(--c)}
.rm-top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.rm-top .vial{width:20px;height:27px}
.rm-top b{font-family:var(--display);font-weight:600;font-size:1.3rem;letter-spacing:-.05em;line-height:1.1;color:#fff;text-shadow:0 0 8px var(--cl),0 0 22px var(--c)}
.rm-top .m{margin-left:auto;font-size:.76rem;color:var(--cl)}
.rm-box{position:relative;aspect-ratio:16/10;flex:none}
.rm-box>i{position:absolute;inset:0;display:block}
.rm-box::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 45%,rgba(0,0,0,.5) 100%)}
.rm-box::after{content:"";position:absolute;left:18%;right:18%;top:80%;height:2px;z-index:2;background:var(--cl);box-shadow:0 0 10px 2px var(--c);opacity:.75}
.rm-ceil{background:linear-gradient(180deg,var(--cl),var(--c));clip-path:polygon(0 0,100% 0,82% 20%,18% 20%)}
.rm-floor{background:linear-gradient(180deg,var(--cs),var(--cf));clip-path:polygon(0 100%,100% 100%,82% 80%,18% 80%)}
.rm-wl{background:linear-gradient(90deg,var(--cf),var(--cs));clip-path:polygon(0 0,18% 20%,18% 80%,0 100%)}
.rm-wr{background:linear-gradient(270deg,var(--cf),var(--cs));clip-path:polygon(100% 0,82% 20%,82% 80%,100% 100%)}
.rm-box>i.rm-back{inset:20% 18%;background:radial-gradient(ellipse 110% 100% at 50% 0%,var(--cl) 0%,var(--c) 55%,var(--cs) 100%)}
.rm-box>i.rm-light{inset:6% 32% auto 32%;height:4%;z-index:2;background:#fff;opacity:.5;border-radius:2px;box-shadow:0 0 12px 3px var(--cl);transition:opacity .8s,box-shadow .8s}
.room.ready .rm-light{opacity:.85}
.room.poured .rm-light{opacity:1;box-shadow:0 0 22px 8px #fff}
.rm-fig{position:absolute;left:36%;bottom:21%;height:48%;aspect-ratio:24/50;z-index:2}
.rm-fig svg{display:block;height:100%;width:auto;fill:rgba(5,6,12,.88)}
.room:not(.claimed):not(.ready):not(.poured) .rm-fig svg{fill:none;stroke:rgba(255,255,255,.65);stroke-width:1.2;stroke-dasharray:3 3}
.rm-vial{position:absolute;left:56%;bottom:22%;z-index:2;filter:drop-shadow(0 0 8px rgba(255,255,255,.85))}
.rm-vial .vial{width:22px;height:30px}
.rm-foot{padding:8px 14px 12px;display:grid;gap:5px;flex:1;align-content:start;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}
.rm-q{font-size:.82rem;line-height:1.3;color:#e6eaf2}
.rm-stat{font-weight:700;font-size:.8rem;color:var(--cl)}
.rm-foot .btn{color:var(--ink);justify-self:start;margin-top:4px}
.vial{width:30px;height:40px;flex:none}
.vial-wrap svg{display:block}

/* overlays and reveal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,20,28,.74);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;overflow:auto}
.overlay.solid{background:var(--bg);display:block;padding:0}
.reveal{width:min(860px,100%);border-radius:14px;background:#fff;color:var(--ink);padding:0 0 28px;display:grid;gap:18px;overflow:hidden;box-shadow:0 0 0 2px var(--c),0 0 44px 4px var(--c),0 40px 100px -30px #000;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.reveal>*:not(.rh){margin-inline:clamp(18px,3vw,32px)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.reveal .rh{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:#fff;padding:22px clamp(18px,3vw,32px) 14px;border-bottom:3px solid var(--c)}
.reveal .rh b{font-family:var(--display);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:600;letter-spacing:-.05em;line-height:1;color:var(--ca)}
.reveal .rh span{font-size:.95rem;color:var(--ink2);font-weight:500}
.reveal .rq{font-size:1.15rem;color:var(--ink);font-weight:500;line-height:1.3}
.contrib{display:grid;gap:14px;justify-items:center}
.cq{font-weight:500;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.3;margin:0;text-align:left;max-width:28em;white-space:pre-wrap}
.frame img{display:block;max-width:100%;max-height:52vh;object-fit:contain}
.frame.paper{background:#fff;padding:8px;border:1px solid var(--line);border-radius:4px;transform:rotate(-1deg);box-shadow:0 18px 34px -18px rgba(15,20,28,.5)}
.frame.polaroid{background:#fff;padding:12px 12px 42px;border:1px solid var(--line);border-radius:3px;transform:rotate(1.4deg);box-shadow:0 18px 34px -18px rgba(15,20,28,.5)}
.contrib video.big{max-width:100%;max-height:52vh;border-radius:8px;background:#000}
.cap{font-size:1rem;color:var(--ink2);text-align:center;max-width:30em}
.player{display:flex;gap:18px;align-items:center;padding:14px 24px;border-radius:12px;border:2px solid var(--c,var(--line));background:#fff}
.playbtn{width:56px;height:56px;border-radius:50%;border:none;background:var(--c,#2d56d6);color:var(--ci,#fff);font-size:1.2rem;font-weight:700}
.player .bars{height:48px}.player .bars i{width:6px}
.whorev{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(14px,3vw,28px);width:100%;align-items:start}
.whorev.solo{grid-template-columns:1fr}
.whorev .col{display:grid;gap:10px;justify-items:start;align-content:start;min-width:0}
.whorev .lab{font-size:.82rem;color:var(--ca);font-weight:700}
.whorev .cq{font-size:clamp(1.05rem,1.9vw,1.5rem);line-height:1.3}
.imgwrap{position:relative;width:100%;max-width:340px}
.whorev img.gen{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#fff}
.stamp{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;background:#fff;font-size:.78rem;font-weight:700;box-shadow:0 4px 12px rgba(15,20,28,.22)}
.stamp::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}
.stamp.accepted{color:#13803a}.stamp.rejected{color:#c4281c}.stamp.discuss{color:#a86a00}
.mismatch{background:#fff3ef;border:1px dashed #e07a5f;border-radius:8px;padding:10px 14px;font-size:.95rem;color:var(--ink2);width:100%}
.contrib.mini{gap:8px;justify-items:center}
.contrib.mini .cq{font-size:1rem;line-height:1.35;font-weight:500;text-align:center}
.contrib.mini .whorev .cq{text-align:left;font-size:.95rem}
.contrib.mini .frame img{max-height:96px}
.contrib.mini video{max-height:96px}
.contrib.mini .frame{padding:4px!important;transform:none}
.contrib.mini .player{padding:6px 12px;gap:10px}.contrib.mini .playbtn{width:34px;height:34px;font-size:.8rem}.contrib.mini .player .bars{height:26px}
.contrib.mini .cap{text-align:center;font-size:.92rem}
.contrib.mini .whorev{gap:14px}
.contrib.mini .whorev .imgwrap{max-width:none}
.contrib.mini .stamp{font-size:.7rem;padding:3px 8px;left:6px;bottom:6px}
.readybox .card{border:2px solid var(--c);border-radius:14px;width:100%;text-align:center;display:grid;justify-items:center}

/* create / compare */
.cmp{display:grid;gap:10px}
.cmprow{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;border-left:6px solid var(--c);animation:fadein .8s both;animation-delay:var(--d,0s)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.cmprow .rl{font-size:.82rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.cmprow .rr{font-weight:500;font-size:1.08rem;line-height:1.35}
.cmphead{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;padding:0 16px;color:var(--muted);font-size:.88rem;font-weight:600}
@media(max-width:700px){.cmprow,.cmphead{grid-template-columns:1fr}}
.belief{font-weight:500;font-size:1.3rem;line-height:1.35}

/* chat */
.chat{display:grid;gap:12px;max-height:48vh;overflow:auto;padding:4px 6px 4px 0;align-content:start;scroll-behavior:smooth}
.msg{max-width:88%;padding:12px 16px;border-radius:12px;line-height:1.45;animation:fadein .5s both}
.msg small{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px;font-weight:600}
.msg.human{justify-self:end;background:var(--wash2);border-bottom-right-radius:3px}
.msg.robot{justify-self:start;background:#fff;border:1px solid var(--line);border-left:5px solid #e8307f;border-bottom-left-radius:3px;font-size:1.08rem;line-height:1.4}
.msg.final{font-size:1.25rem;font-weight:500;border-left-color:#0f141c}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:.9rem;color:var(--ink2)}
.chip:hover:not(:disabled){border-color:var(--ink)}
.askrow{display:flex;gap:10px}
.askrow .input{flex:1}

/* vote */
.fq{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.12;letter-spacing:-.05em}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vopt{border:1px solid var(--line);border-radius:12px;background:#fff;padding:22px 12px 16px;display:grid;gap:6px;justify-items:center;text-align:center;transition:all .3s}
.vopt .vl{font-family:var(--display);font-size:clamp(1.05rem,2vw,1.6rem);font-weight:600;letter-spacing:-.04em}
.vopt .vn{font-size:3rem;font-family:var(--display);font-weight:400;letter-spacing:-.05em;line-height:1}
.vopt.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.vopt .adj{display:flex;gap:8px;margin-top:6px}
.vopt .adj button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:1.2rem;line-height:1}
.vopt .adj button:hover{border-color:var(--ink)}
.endmsg{font-family:var(--display);font-weight:500;letter-spacing:-.05em;font-size:clamp(1.7rem,3.4vw,2.8rem);line-height:1.1;animation:fadein 1.6s both}

/* station (a group's own neon room) */
.swrap{position:relative;min-height:100vh;min-height:100dvh}
.swrap.roomed{background:radial-gradient(ellipse 75% 34% at 50% 0%,var(--cl) 0%,transparent 75%),linear-gradient(90deg,rgba(0,0,0,.65) 0%,transparent 22%,transparent 78%,rgba(0,0,0,.65) 100%),linear-gradient(180deg,var(--c) 0%,var(--cs) 55%,var(--cd) 100%)}
.swrap.roomed::after{content:"";position:absolute;left:0;right:0;top:84%;height:2px;background:var(--cl);box-shadow:0 0 18px 4px var(--c);opacity:.45;pointer-events:none}
.station{max-width:560px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.shead{display:flex;align-items:center;gap:10px;justify-content:space-between;padding-top:6px}
.shead .brand{font-size:.9rem}
.swrap.roomed .shead{color:var(--ci)}
.station .shead .btn{background:transparent;color:inherit;border-color:currentColor}
.st-banner{color:var(--ci);padding:14px 2px 6px}
.st-banner b{font-family:var(--display);font-weight:600;font-size:clamp(3rem,16vw,5rem);letter-spacing:-.07em;line-height:.95;display:block;text-shadow:0 0 14px var(--cl),0 0 44px var(--c)}
.st-banner span{font-size:1rem;opacity:.92;display:block;margin-top:6px}
.st-light{display:block;width:96px;height:6px;background:#fff;border-radius:3px;margin-bottom:16px;box-shadow:0 0 16px 4px var(--cl)}
.sheet{background:#fff;color:var(--ink);border-radius:12px;padding:18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.swrap.roomed .sheet{box-shadow:0 0 0 2px var(--cl),0 0 34px 2px var(--c),0 30px 70px -30px rgba(0,0,0,.7)}
.sbody{display:grid;gap:18px;align-content:start}
.mkq{font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.2;letter-spacing:-.04em}
.mkhint{color:var(--ink2)}
.frametxt{color:var(--muted);font-size:.98rem;line-height:1.45}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs:empty{display:none}
.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:.92rem;font-weight:500;color:var(--ink2)}
.tab.on{background:var(--c,var(--ink));color:var(--ci,#fff);border-color:transparent;font-weight:700}
.tabbody{display:grid;gap:12px}
.pad{width:100%;aspect-ratio:1;border-radius:8px;touch-action:none;display:block;cursor:crosshair;border:1px solid var(--line)}
.palette{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.sz{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{border-color:var(--ink)}
.rec{display:grid;gap:12px}
.recstage{aspect-ratio:4/3;border-radius:8px;border:1px solid var(--line);background:var(--wash);display:grid;place-items:center;overflow:hidden}
.recstage video{width:100%;height:100%;object-fit:cover}
.recstage audio{width:90%}
.recstage .ph{color:var(--muted);padding:18px;text-align:center;font-size:.95rem}
.sounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.snd{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px 12px;text-align:left;display:grid;gap:2px}
.snd.on{border-color:var(--c,var(--ink));box-shadow:0 0 0 2px var(--c,var(--ink)) inset}
.snd small{color:var(--muted)}
.dimlist{display:grid;gap:10px}
.dimbtn{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 16px}
.dimbtn:hover:not(:disabled){border-color:var(--c)}
.dimbtn b{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:-.04em}
.whoout{display:grid;gap:12px}
.whoout img.gen{width:100%;border-radius:8px;background:#fff;border:1px solid var(--line)}
.sbusy{display:flex;gap:10px;align-items:center;color:var(--ink2)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--c,var(--ink));animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.readybox{display:grid;gap:16px;justify-items:center;text-align:center;padding:6px 0}
.readybox .vial-wrap svg{width:96px;height:128px}
.readybox .vial-wrap.bubbling{animation:float 6s ease-in-out infinite}
.brewwrap{display:grid;justify-items:center;padding-top:4px}
.brew{width:150px;height:auto;overflow:visible;display:block}
.bf-glass{fill:rgba(255,255,255,.35);stroke:var(--bc);stroke-width:3.5;stroke-linejoin:round}
.bf-w1{fill:var(--bc);fill-opacity:.9;animation:wv60 2.6s linear infinite}
.bf-w2{fill:var(--bc);fill-opacity:.5;animation:wv60 4.2s linear infinite reverse}
@keyframes wv60{to{transform:translateX(-60px)}}
.bf-liq{transform-origin:60px 120px;animation:slosh 3.2s ease-in-out infinite}
@keyframes slosh{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
.bf-swirl{fill:none;stroke:rgba(255,255,255,.6);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:20 52;animation:swirl 2.2s linear infinite}
@keyframes swirl{to{stroke-dashoffset:-72}}
.bf-b{fill:rgba(255,255,255,.8);opacity:0;animation:bfrise 3.4s ease-in infinite}
@keyframes bfrise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.bf-rock{transform-origin:60px 150px;animation:rock 3.2s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.bf-steam{fill:none;stroke:var(--bc);stroke-width:3;stroke-linecap:round;opacity:0;animation:steam 3s ease-out infinite}
.bf-steam.s2{animation-delay:-1.5s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.75}100%{opacity:0;transform:translateY(-10px)}}
.rehearse{width:min(580px,100%);display:grid;gap:16px;background:#fff;border-radius:14px;padding:22px;box-shadow:0 40px 100px -30px #000}
.rehearse h3{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:-.04em;margin-top:4px}
.rehgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rehdim{border-left:5px solid var(--c);text-align:left}
.pxbig{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity 1.2s;pointer-events:none}
.pxbig svg{width:94%;height:auto;display:block}
.robotwrap .rbt{transition:opacity 1s}
.robotwrap.awake .rbt{opacity:0}
.robotwrap.awake .pxbig{opacity:1}
.pxb .g-head.t-b{fill:var(--who-b)}.pxb .g-head.t-s{fill:var(--who-s)}.pxb .g-head.t-h{fill:var(--who-h)}
.pxb .g-body.t-b{fill:var(--when-b)}.pxb .g-body.t-s{fill:var(--when-s)}.pxb .g-body.t-h{fill:var(--when-h)}
.pxb .g-arm.t-b{fill:var(--how-b)}.pxb .g-arm.t-s{fill:var(--how-s)}.pxb .g-arm.t-h{fill:var(--how-h)}
.pxb .g-leg.t-b{fill:var(--where-b)}.pxb .g-leg.t-s{fill:var(--where-s)}.pxb .g-leg.t-h{fill:var(--where-h)}
.pxb .g-stem{fill:#8f98b3}.pxb .g-mouth{fill:#2a1f3d}
.pxb .g-ant{fill:#b9bfd0;transition:fill .8s steps(3)}
.pxb.lit .g-ant{fill:var(--feeling-h);filter:drop-shadow(0 0 1.4px var(--feeling-b))}
.pxb .g-eye{fill:#3a3048;transition:fill .8s steps(3)}
.pxb.lit .g-eye{fill:var(--what-h);filter:drop-shadow(0 0 1.2px var(--what-b))}
.pxb.res-yes{filter:drop-shadow(0 0 14px #ffc933)}
.pxb.res-no{filter:grayscale(1) opacity(.65)}
.pxb.res-notyet{animation:dimpulse 3.4s ease-in-out infinite}
.phoneframe{position:fixed;right:18px;bottom:18px;width:372px;height:min(720px,88vh);z-index:55;display:flex;flex-direction:column;background:#0f141c;border-radius:36px;padding:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.phonebar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:.8rem;padding:2px 8px 8px}
.phonebar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.phonebody{flex:1;overflow:auto;border-radius:24px;background:var(--bg)}
.phonebody .swrap{min-height:100%}
.camview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#000;display:block}
.stat-title{font-family:var(--display);font-weight:500;font-size:1.5rem;line-height:1.1;letter-spacing:-.05em}

/* pixel robot + heart */
.pxscene{display:grid;justify-items:center;gap:12px}
.pxscreen{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 22px 12px;box-shadow:0 0 0 6px var(--wash2)}
.pxscreen svg{display:block;width:var(--w,190px);height:auto;shape-rendering:crispEdges}
.pxcap{font-size:.95rem;color:var(--ink2);text-align:center;max-width:22em;min-height:2.6em}
.cmprow .contrib.mini .whorev{grid-template-columns:1fr;gap:10px}
.cmprow .contrib.mini .whorev .imgwrap{max-width:150px}
.pp{fill:#101520}
.stagepx .rg .pl{fill:#d9dde8}.stagepx .rg .ps{fill:#bcc2d2}.stagepx .rg .ph{fill:#eef0f6}.stagepx .rg .pe{fill:#c7cddb}.stagepx .rg .pm{fill:#98a0b6}.stagepx .rg .pp{fill:#c7cddb}
.stagepx .rg rect{transition:fill .7s steps(4);transition-delay:calc(var(--i,0) * 45ms)}
.stagepx .rg.on .pl,.stagepx .rg.on .pe{fill:var(--pc)}
.stagepx .rg.on .ps,.stagepx .rg.on .pm{fill:var(--pcs)}
.stagepx .rg.on .ph{fill:var(--pch)}
.stagepx.alive .rg .pp{fill:#101520}
.stagepx.alive .r-what{animation:blink 5.5s infinite;transform-origin:13px 8.5px}
.stagepx.splash{filter:drop-shadow(0 0 10px var(--flash,#000));transition:filter .3s}
.stagepx.res-yes{filter:drop-shadow(0 0 14px #ffc933)}
.stagepx.res-no{filter:grayscale(1) opacity(.6)}
.stagepx.res-notyet{animation:dimpulse 3.4s ease-in-out infinite}
.pk{fill:#101520}.pl{fill:#c6cbe0}.ps{fill:#98a0c2}.ph{fill:#f4f6ff}.pm{fill:#4a5170}.pe{fill:#4a5170}.pa{fill:#a3abc8}
.pxs.lit .pe{fill:#19b8d9}.pxs.lit .pa{fill:#ffc933}
.pxs .rb{transition:opacity .9s}
.hp{transition:fill .6s steps(3);transition-delay:calc((10 - var(--r)) * 110ms)}
.hR{fill:#dfe3ec}.hD{fill:#bcc3d2}.hW{fill:#eef1f6}
.hp.on.hR{fill:#f21616}.hp.on.hD{fill:#8f0a0a}.hp.on.hW{fill:#fff}
.pxs.full .hg{animation:pxbeat 1.2s steps(2) infinite;transform-origin:13px 23px}
@keyframes pxbeat{50%{transform:scale(1.07)}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

let lastTwist=-1;
function twist(f,seed){

  for(let i=0;i<opts.length;i++){const k=(seed+i)%opts.length;if(k===lastTwist)continue;const t=opts[k]();if(t){lastTwist=k;return t}}
  return '';

async function builtInReply(msg){

  const prior=Object.values(D.chat).filter(m=>m.role==='robot'&&!m.final&&m.ts<msg.ts).length;
  const seed=hashStr(q)+prior;
  for(const list of [TPL[it],TPL.generic]){
    for(let i=0;i<list.length;i++){
      const out=list[(seed+i)%list.length](f,rb.name);
      if(out){const add=(seed%4===0&&['define','feel','who','belong','know','memory'].indexOf(it)>=0&&list===TPL[it]&&out.length<230)?twist(f,seed):'';return(out+(add?' '+add:'')).trim()}

function fallbackRobot(name){

    what:f.IMG?'I learned that love can be drawn: '+f.IMG+'. That means it holds still sometimes.':'I learned that love can be drawn, which means it holds still sometimes.',
    when:f.M?'I learned that love is a moment: '+Q(f.M):'I learned that love lives in moments that pass.',
    where:f.PL?'I learned that love has an address: '+f.PL+'.':'I learned that love has a place, and that places can be loved back.',
    how:f.ACT?'I learned that love is something people do: '+f.ACT+'.':'I learned that love is something you do with your body.',
    feeling:f.SND?'I learned that love sounds like '+f.SND+'.':'I learned that love has a sound, though I only know how it is described.'};

    voice:'Soft and a little literal, as if translating from another language.',

async function makeRobot(name,onStatus){
  const sample=await getSample();const fb=fallbackRobot(name);
  if(!sample)return fb;
  try{
    let imgs=[],notes=[];
    try{
      const lim=await sample.limits();
      if(lim&&lim.images){
        const cand=[['what',D.contribs.what&&D.contribs.what.img,'the drawing or image the group made for "What"'],['where',D.contribs.where&&D.contribs.where.img,'the photograph the group took for "Where"'],['who',D.contribs.who&&D.contribs.who.sketch,'a sketch the group drew for "Who"']].filter(x=>x[1]&&/^data:image\/(jpeg|png)/.test(x[1]));
        cand.slice(0,lim.images.maxCount||3).forEach((x,i)=>{imgs.push(dataURLtoBlob(x[1]));notes.push('Image '+(i+1)+' is '+x[2]+'.')});
      }
    }catch(e){imgs=[];notes=[]}
    if(onStatus)onStatus('Listening to what the room gave it\u2026');
    const prompt='You are helping create a character for an immersive art experience about love and belonging. A room of people just taught a robot what love is, one dimension per group, each in a different medium. The robot has now been named "'+name+'". Using ONLY what they gave it, write the robot\u2019s inner life.\n\nWhat the groups contributed:\n'+digest()+'\n'+(notes.length?'\n'+notes.join(' ')+' Look at the images carefully and let what you actually see shape the robot\u2019s understanding.\n':'')+
    '\nThe robot is not an authority on love. It is a reflection of this particular room. It should recognise real details from the contributions but may simplify, over-literalise, blend or slightly misunderstand them, in a tender way. Avoid cliche and greeting-card language.\n\nReply with only JSON of this shape:\n{"personality":"two sentences about who this robot is, third person, tender and slightly odd","voice":"one sentence on how it speaks","belief":"2-3 sentences, first person: the robot\u2019s own working theory of love, built from the contributions","learned":{"who":"...","what":"...","when":"...","where":"...","how":"...","feeling":"..."},"firstWords":"one short line it says on waking"}\nEach "learned" value is ONE first-person sentence (max 24 words): what the robot believes it learned from that contribution.';
    const data=await sample.json(prompt,{cache:false,images:imgs.length?imgs:undefined});

}
async function robotReply(msg){
  const rb=D.room.robot||{name:'Robot',belief:''};
  const sample=await getSample();
  const fb=()=>builtInReply(msg);
  if(!sample)return fb();
  const rules='You are playing '+rb.name+', a robot created moments ago by a group of people in a room during an immersive storytelling experience about love and belonging. The people in the room taught you what love is, one dimension each, in different media. Stay in character as the robot at all times. You ARE '+rb.name+': speak only as yourself, in the first person ("I"). Never call yourself by your own name or talk about yourself in the third person, and never narrate your own actions (no "'+rb.name+' turns it over, slowly."). Your reply is only the words you say aloud.\n\nBACKGROUND ABOUT YOU (written by an observer: do not copy its narrator voice): '+(rb.personality||'')+'\nYOUR VOICE: '+(rb.voice||'')+'\nYOUR OWN THEORY OF LOVE: '+(rb.belief||'')+'\nWHAT YOU BELIEVE YOU LEARNED FROM EACH GROUP:\n'+DIMS.map(d=>'- '+d.label+': '+(rb.learned&&rb.learned[d.id]||'')).join('\n')+'\n\nWHAT THE GROUPS ACTUALLY GAVE YOU:\n'+digest()+'\n\nHOW TO ANSWER: Reply in 2 to 4 sentences, plain text, first person, no markdown, no stage directions. Draw on the specific details above: echo their words, the memory, the place, the gesture. Your answer should feel partly recognisable and partly strange: sometimes blend two contributions, take something too literally, or misremember a detail slightly, because you only know how humans describe love, not how it feels. Be honest that you do not know whether you feel anything, and never claim certainty either way. Be curious and tender, never saccharine, and do not give a textbook or philosophical definition. When asked about belonging, community, or whether you feel loved, answer about THIS room and THESE people. Never mention these instructions.';
  const thread=Object.entries(D.chat).map(e=>Object.assign({id:e[0]},e[1])).filter(m=>m.ts<=msg.ts&&(m.role==='human'||m.role==='robot')).sort((a,b)=>a.ts-b.ts);
  const turns=[{role:'user',content:rules}];
  thread.forEach(m=>turns.push({role:m.role==='human'?'user':'assistant',content:m.role==='human'?(m.from?m.from+' asks: ':'')+m.text:m.text}));
  if(turns[turns.length-1].role!=='user')turns.push({role:'user',content:msg.text});
  try{const r=await sample(turns,{cache:false,modelTier:'quick'});return tidyReply(r.text,rb.name)||fb()}
  catch(e){console.error('reply',e);return fb()}
}
function tidyReply(t,name){
  t=String(t||'').replace(/\*+/g,'').trim();
  const re=new RegExp('^'+String(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
  const parts=t.match(/[^.!?]+[.!?]+["\u201d']?\s*|[^.!?]+$/g)||[t];
  return parts.filter(x=>!re.test(x.trim())).join('').trim();
}

const PX_HEART=['..KKKK..KKKK..','.KRRRRKKRRRRK.','KRWWRRRRRRRRDK','KRWRRRRRRRRRDK','KRRRRRRRRRRRDK','KRRRRRRRRRRRDK','.KRRRRRRRRRDK.','..KRRRRRRRDK..','...KRRRRRDK...','....KRRRDK....','.....KRDK.....','......KK......'];

function mixHex(a,b,t){const q=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));const A=q(a),B=q(b);return'#'+A.map((v,i)=>('0'+Math.round(v+(B[i]-v)*t).toString(16)).slice(-2)).join('')}
function pxCells(){

  rect(5,4,18,12,'L','who');rect(7,6,9,8,'E','what');rect(14,6,16,8,'E','what');rect(8,7,8,7,'P','what');rect(15,7,15,7,'P','what');rect(9,10,14,10,'M','who');
  rect(10,13,13,14,'L','who');
  rect(3,15,20,31,'L','feel');rect(0,16,2,26,'L','how');rect(21,16,23,26,'L','how');
  rect(6,32,9,35,'L','where');rect(14,32,17,35,'L','where');
  rect(6,29,17,30,'M','when');
  [[18,4,18,12],[20,15,20,31],[2,16,2,26],[23,16,23,26],[9,32,9,35],[17,32,17,35]].forEach(a=>rect(a[0],a[1],a[2],a[3],'S'));
  rect(6,5,6,6,'H');rect(4,16,4,18,'H');
  PX_HEART.forEach((row,r)=>{for(let c=0;c<14;c++){const ch=row[c];if(ch==='.')continue;g[16+r+1][5+c+1]=ch==='K'?{t:'K',r:null}:{t:ch,r:null,hr:r}}});
  const cells=[];

    if(v===null){const nb=[[0,1],[0,-1],[1,0],[-1,0]].some(d=>{const yy=y+d[0],xx=x+d[1];return yy>=0&&yy<H&&xx>=0&&xx<W&&g[yy][xx]!==null});if(nb)cells.push({x,y,t:'K',r:null})}
